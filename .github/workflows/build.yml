name: Build and Release Windows EXE

on:
  workflow_dispatch:

  push:
    tags:
      - "v*"

# Deny everything by default; each job requests only what it needs.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    name: Audit dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266 # v1.1.0
        with:
          inputs: requirements-build.txt
          require-hashes: true

  build:
    name: Build EXE
    needs: audit
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write     # Sigstore identity for the provenance attestation
      attestations: write # Store the provenance attestation
    env:
      HAS_SIGNING_CERT: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install locked dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes --no-deps -r requirements-build.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build EXE
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --noupx --name Win11NetSpeedCompact src/widget.py

      - name: Sign EXE
        if: env.HAS_SIGNING_CERT == 'true'
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'signing.pfx'
          try {
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_BASE64))
            $pw = ConvertTo-SecureString $env:PFX_PASSWORD -AsPlainText -Force
            ./scripts/sign_release.ps1 -PfxPath $pfx -PfxPassword $pw
          } finally {
            Remove-Item -LiteralPath $pfx -Force -ErrorAction SilentlyContinue
          }

      - name: Generate SHA256
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/Win11NetSpeedCompact.exe -Algorithm SHA256).Hash.ToLower()
          Set-Content -Encoding ASCII dist/Win11NetSpeedCompact.exe.sha256.txt "$hash  Win11NetSpeedCompact.exe"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/Win11NetSpeedCompact.exe

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Win11NetSpeedCompact-Windows
          path: |
            dist/Win11NetSpeedCompact.exe
            dist/Win11NetSpeedCompact.exe.sha256.txt
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # Create the GitHub Release
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Win11NetSpeedCompact-Windows
          path: dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME"
          dist/Win11NetSpeedCompact.exe
          dist/Win11NetSpeedCompact.exe.sha256.txt
          --repo "$GITHUB_REPOSITORY"
          --title "$GITHUB_REF_NAME"
          --generate-notes
          --verify-tag
