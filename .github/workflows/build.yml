name: Build and Release Windows EXE
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Build standalone EXE
        run: pyinstaller --noconfirm --clean --onefile --windowed --name Win11NetSpeedCompact src/widget.py
      - name: Sign when certificate secrets are configured
        if: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 != '' }}
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
        run: |
          [IO.File]::WriteAllBytes("certificate.pfx",[Convert]::FromBase64String($env:PFX_BASE64))
          $signtool=Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter signtool.exe -Recurse | Where-Object FullName -match '\\x64\\' | Sort-Object FullName -Descending | Select-Object -First 1
          & $signtool.FullName sign /f certificate.pfx /p $env:PFX_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 dist/Win11NetSpeedCompact.exe
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          & $signtool.FullName verify /pa /v dist/Win11NetSpeedCompact.exe
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          Remove-Item certificate.pfx -Force
      - name: Generate SHA-256 checksum
        shell: pwsh
        run: |
          $h=(Get-FileHash dist/Win11NetSpeedCompact.exe -Algorithm SHA256).Hash.ToLower()
          Set-Content -Encoding ASCII dist/Win11NetSpeedCompact.exe.sha256.txt "$h  Win11NetSpeedCompact.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: Win11NetSpeedCompact-Windows
          path: |
            dist/Win11NetSpeedCompact.exe
            dist/Win11NetSpeedCompact.exe.sha256.txt
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          generate_release_notes: true
          files: |
            dist/Win11NetSpeedCompact.exe
            dist/Win11NetSpeedCompact.exe.sha256.txt
