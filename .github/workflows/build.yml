name: Build and Release Windows EXE

on:
  workflow_dispatch:

  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install -r requirements.txt pyinstaller

      - name: Build EXE
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name Win11NetSpeedCompact src/widget.py

      - name: Generate SHA256
        shell: pwsh
        run: |
          $hash=(Get-FileHash dist/Win11NetSpeedCompact.exe -Algorithm SHA256).Hash.ToLower()
          Set-Content -Encoding ASCII dist/Win11NetSpeedCompact.exe.sha256.txt "$hash  Win11NetSpeedCompact.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: Win11NetSpeedCompact-Windows
          path: |
            dist/Win11NetSpeedCompact.exe
            dist/Win11NetSpeedCompact.exe.sha256.txt

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          generate_release_notes: true
          files: |
            dist/Win11NetSpeedCompact.exe
            dist/Win11NetSpeedCompact.exe.sha256.txt